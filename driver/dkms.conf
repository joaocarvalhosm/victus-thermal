PACKAGE_NAME="hp-wmi-victus-8c2f"
PACKAGE_VERSION="1.0.0"

BUILT_MODULE_NAME[0]="hp-wmi"
DEST_MODULE_LOCATION[0]="/updates/dkms"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${module}/${module_version}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${module}/${module_version}/build clean"

# hp-wmi.c is the Ubuntu 7.0 driver plus one board-table entry. Internal kernel
# APIs move between series, so only build for 7.0.x; on any other kernel DKMS
# skips the build and the stock in-tree hp-wmi keeps working (fans fall back to
# the firmware curve, nothing breaks). Rebase hp-wmi.c before widening this.
BUILD_EXCLUSIVE_KERNEL="^7\.0\."

AUTOINSTALL="yes"
