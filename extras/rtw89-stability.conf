# /etc/modprobe.d/rtw89-stability.conf
#
# Realtek RTL8852BE Wi-Fi (rtw89_8852be) stability workaround.
#
# On this laptop the driver logs "timed out to flush queues" /
# "timed out to flush pci txch" under kernel 7.0. PCIe link power saving
# (ASPM L1/L1SS, CLKREQ) and the firmware low-power mode are the usual
# triggers for that on the 8852BE. Disabling them costs roughly 0.3-0.5 W on
# battery.
#
# Install:  sudo cp extras/rtw89-stability.conf /etc/modprobe.d/ && reboot
# Remove:   sudo rm /etc/modprobe.d/rtw89-stability.conf && reboot

options rtw89_pci disable_aspm_l1=y disable_aspm_l1ss=y disable_clkreq=y
options rtw89_core disable_ps_mode=y
